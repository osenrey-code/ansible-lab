---
- name: Administrar servidores Ubuntu del laboratorio
  hosts: docker
  gather_facts: true
  become: false

  tasks:
    - name: Mostrar el nombre del host
      ansible.builtin.debug:
        msg: "Host: {{ inventory_hostname }} ({{ ansible_hostname }})"

    - name: Mostrar el sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Crear el directorio principal
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: '0755'

    - name: Crear info.txt con el servidor y el sistema operativo
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: "Servidor: {{ inventory_hostname }}\nSistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}\n"
        mode: '0644'

    - name: Crear subdirectorios mediante un loop
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje para Ubuntu
      ansible.builtin.debug:
        msg: "El sistema operativo es Ubuntu. Laboratorio configurado correctamente."
      when: ansible_distribution == 'Ubuntu'
